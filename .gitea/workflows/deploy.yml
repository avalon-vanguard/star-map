# Construit l'image de star-map, la pousse dans le registre Gitea et la déploie dans Openship :
# service interne, sans domaine, que la passerelle projects.avalonvanguard.com sert sous /star-map/.
# Secret du dépôt : OPENSHIP_API_TOKEN, jeton Openship limité au projet « star-map ». Il passe devant
# celui de l'organisation, qui ne couvre que « projects » : ne pas le supprimer.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: avalon-vanguard/ci/.gitea/workflows/image.yml@v1
    with:
      openship-project: proj_UPRoF2jaxkCMZAlG
      openship-service: svc_aZAHqXxnUUyzC-_l
    secrets: inherit
