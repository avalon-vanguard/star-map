name: CI

# star-map CI, through the organisation's shared workflow
# (avalon-vanguard/ci, node.yml): lint, typecheck, unit tests, production build, then the
# Playwright suite. Same triggers: pull requests and the branches they merge into, plus manual
# dispatch.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: avalon-vanguard/ci/.gitea/workflows/node.yml@v1
    # Pas d'e2e pour l'instant : la carte 3D rendue en logiciel par Chromium, sur ng serve,
    # dépasse le runner du VPS (17 tests, 7 en échec par délai dépassé en 16,8 min). À
    # remettre (e2e: true) une fois le runner capable de les passer.
    secrets: inherit
