# star-map under /star-map/, behind the projects.avalonvanguard.com gateway: it passes the
# path through as is, sets the security headers and compression, and redirects /star-map to
# /star-map/. This server only handles the SPA fallback and caching.

server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative redirects: behind the gateway, an absolute redirect would point to
    # http://<container>:80
    absolute_redirect off;
    server_tokens off;

    # Angular SPA (PathLocationStrategy): deep links (/star-map/body/mars) return
    # index.html with a 200.
    location /star-map/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /star-map/index.html;
    }
    # Hashed files of the Angular build (main-XXXXXXXX.js…): long cache
    location ~* "^/star-map/.+-[0-9a-z]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Astronomical data refreshed every week, unhashed: revalidated on every visit
    location /star-map/assets/data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
