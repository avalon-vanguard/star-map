# star-map sous /star-map/, derrière la passerelle projects.avalonvanguard.com : elle transmet le
# chemin tel quel, pose les en-têtes de sécurité et la compression, et redirige /star-map vers
# /star-map/. Ce serveur ne règle que le repli SPA et le cache.

server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirections relatives : derrière la passerelle, une redirection absolue pointerait vers
    # http://<conteneur>:80
    absolute_redirect off;
    server_tokens off;

    # SPA Angular (PathLocationStrategy) : les liens profonds (/star-map/body/mars) renvoient
    # index.html avec un 200.
    location /star-map/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /star-map/index.html;
    }
    # Fichiers à empreinte du build Angular (main-XXXXXXXX.js…) : cache long
    location ~* "^/star-map/.+-[0-9a-z]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Données astronomiques rafraîchies chaque semaine, sans empreinte : revalidées à chaque visite
    location /star-map/assets/data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
