name: CI

# Gitea port of .github/workflows/ci.yml, through the organisation's shared workflow
# (avalon-vanguard/ci, node.yml): lint, typecheck, unit tests, production build, then the
# Playwright suite. Same triggers: pull requests and the branches they merge into, plus manual
# dispatch.
#
# A .gitea/workflows directory makes Gitea ignore .github/workflows, so pages.yml,
# data-refresh.yml and junie-review.yml now run on GitHub only, until they are ported.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: avalon-vanguard/ci/.gitea/workflows/node.yml@runs-on-input
    # e2e Playwright réactivés, sur le runner `big` du VPS (stack, services/gitea-runner/runner-big.yml) :
    # la carte 3D rendue en logiciel par Chromium sur ng serve dépassait le petit runner (17 tests,
    # 7 en échec par délai dépassé en 16,8 min). Tout le job de vérification tourne donc là.
    with:
      e2e: true
      runs-on: big
      timeout-minutes: 45
    secrets: inherit
