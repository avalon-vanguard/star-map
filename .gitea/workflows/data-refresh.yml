name: Catalogue refresh

# Replays the ETL against the online archives every week and, when the data has actually
# changed, opens a pull request to main (hotfix: branch fix/data-refresh-<UTC date>), so that
# the catalogues follow NASA without touching the code. main refuses direct pushes: the
# owner reviews and merges the PR, which triggers the deployment, then merges main back into
# develop like any hotfix. The archives read (HYG, Exoplanet Archive, JPL Horizons,
# OpenNGC, Gaia) are public, anonymous endpoints: no key.
#
# The job's token triggers no workflow: a PR opened with it would never get its
# checks. The push and the PR therefore use the DATA_REFRESH_TOKEN repository secret, a PAT
# (write:repository scope) of a bot account. With no data change, it is not read.
on:
  schedule:
    # Monday 05:23 UTC. An arbitrary minute rather than :00, the busiest minute of cron.
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Never two refreshes at once, and never a cancellation in the middle of a push.
concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: read # the job pushes nothing with its own token

jobs:
  refresh:
    name: Fetch, validate, propose
    runs-on: big
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The data lives on main, whatever ref the workflow file was launched
          # from: the hotfix branch starts from this commit.
          ref: main
          # The job's token must not stay in the git config: the push uses the bot's.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gaia DR3 is a frozen release: the same query returns the same bytes, so its
      # responses carry over from one run to the next instead of being downloaded again every week
      # from an archive that times out under load. Same for van Leeuwen's Hipparcos reduction
      # (2007), whose parallax errors fetchStars requires. The key follows gaia.ts, where the
      # queries are written: a modified query is downloaded again.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tools/etl/.cache/gaia-dr3-*.csv
            tools/etl/.cache/hipparcos-errors-*.csv
          key: gaia-dr3-hipparcos-${{ hashFiles('tools/etl/sources/gaia.ts') }}

      # The other sources are read live on this fresh runner. A failed download fails
      # the run, on purpose: no refresh is better than a partial one.
      - name: Rebuild the datasets
        run: npm run etl

      - name: Detect a real change
        id: diff
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if git diff --quiet -- src/assets/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The archives published nothing new: catalogues are byte-for-byte identical." >> "$summary"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "Catalogue changes:"; echo '```'; git diff --stat -- src/assets/data; echo '```'; } >> "$summary"
          fi

      # The PR's CI replays tests and build on the new data: nothing to replay here.
      # The token goes through the git environment (GIT_CONFIG_*) and a curl config file read from
      # stdin: never on a command line, never printed.
      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          DATA_REFRESH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          set -eu
          if [ -z "${DATA_REFRESH_TOKEN}" ]; then
            printf '%s\n' "::error::The data changed but the DATA_REFRESH_TOKEN secret is empty: cannot open the pull request."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: token ${DATA_REFRESH_TOKEN}"

          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          api_curl() {
            printf 'header = "Authorization: token %s"\n' "${DATA_REFRESH_TOKEN}" | curl -fsS -K - "$@"
          }
          branch="fix/data-refresh-$(date -u +%F)"

          # A refresh PR that is already open is waiting for the owner: no stacking.
          open_prs=$(api_curl "${api}/pulls?state=open&limit=50")
          existing=$(printf '%s' "${open_prs}" | node -e '
            const prs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const pr = prs.find((p) => p.head && p.head.ref.startsWith("fix/data-refresh-"));
            if (pr) console.log(pr.html_url);
          ')
          if [ -n "${existing}" ]; then
            echo "::notice::A refresh pull request is already open: ${existing}"
            exit 0
          fi

          # Branch already present with no open PR (rerun the same day): explicit failure.
          rc=0
          git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "::error::Branch ${branch} already exists on the repository with no open PR: delete it or handle it by hand."
            exit 1
          elif [ "${rc}" -ne 2 ]; then
            echo "::error::Cannot read the remote branches (git ls-remote failed, code ${rc})."
            exit 1
          fi

          git config user.name "gitea-actions"
          git config user.email "actions@noreply.avalonvanguard.com"
          git switch -c "${branch}"
          # The README and index.html quote the counts the ETL has just rewritten in them (lib/public-counts.ts).
          git add src/assets/data README.md src/index.html
          git commit -m "🐛 fix(data): refresh the astronomical catalogues" \
            -m "Scheduled ETL run against the online archives. The pull request checks validate the new data."
          git push origin "refs/heads/${branch}:refs/heads/${branch}"

          # The JSON is built by node: the diff stat can contain quotes and line breaks.
          payload=$(STAT="$(git diff --stat HEAD~1 HEAD)" BRANCH="${branch}" node -e '
            const body = "Weekly refresh of the astronomical catalogues.\n\n```\n" + process.env.STAT + "\n```\n";
            console.log(JSON.stringify({
              title: "🚑️ fix(data): refresh the astronomical catalogues",
              head: process.env.BRANCH,
              base: "main",
              body,
            }));
          ')
          response=$(api_curl -X POST -H 'Content-Type: application/json' -d "${payload}" "${api}/pulls")
          printf '%s' "${response}" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).html_url)'
