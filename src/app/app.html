<!-- Viewport frame: the four corner marks that read the whole screen as one instrument, rather
     than as unrelated panels floating on black. Decorative, so it never intercepts scene input. -->
<div
  aria-hidden="true"
  class="hud-brackets pointer-events-none fixed inset-2 z-30 [--hud-tick:1.75rem]"
></div>
